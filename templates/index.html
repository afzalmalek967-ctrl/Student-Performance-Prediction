<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .dashboard-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .dashboard-card h3 {
            color: #555;
            margin-bottom: 8px;
        }

        .dashboard-card p {
            color: #667eea;
            font-weight: bold;
        }

        .dashboard-card a {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        .form-box h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }

        .form-group input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .submit-btn {
            display: block;
            width: 250px;
            margin: 30px auto 0;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #5568d9;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 20px;
        }

        @media (max-width: 700px) {

            .dashboard,
            .form-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 15px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <!-- Header -->

        <div class="header">

            <h1>🎓 Student Performance Prediction System</h1>

            <p>
                Machine Learning Based Student Performance Prediction
            </p>

        </div>


        <!-- Dashboard -->

        <div class="dashboard">

            <div class="dashboard-card">

                <h3>🤖 ML Algorithm</h3>

                <p>Linear Regression</p>

            </div>


            <div class="dashboard-card">

                <h3>🎯 R² Score</h3>

                <p>0.89</p>

            </div>


            <div class="dashboard-card">

                <h3>📊 Dataset</h3>

                <p>300 Students</p>

                <a href="/dataset">
                    View Analysis
                </a>

            </div>

        </div>


        <!-- Prediction Form -->

        <div class="form-box">

            <h2>📝 Enter Student Details</h2>

            <form action="/predict" method="POST">

                <div class="form-grid">


                    <div class="form-group">

                        <label>
                            Student Name
                        </label>

                        <input
                            type="text"
                            name="student_name"
                            placeholder="Enter student name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Enrollment Number
                        </label>

                        <input
                            type="text"
                            name="enrollment"
                            placeholder="Enter enrollment number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Attendance (%)
                        </label>

                        <input
                            type="number"
                            name="attendance"
                            min="0"
                            max="100"
                            step="0.1"
                            placeholder="Example: 85"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Study Hours / Day
                        </label>

                        <input
                            type="number"
                            name="study_hours"
                            min="0"
                            max="24"
                            step="0.1"
                            placeholder="Example: 4"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Internal Marks
                        </label>

                        <input
                            type="number"
                            name="internal_marks"
                            min="0"
                            max="100"
                            step="0.1"
                            placeholder="Example: 72"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Assignment Marks
                        </label>

                        <input
                            type="number"
                            name="assignment_marks"
                            min="0"
                            max="100"
                            step="0.1"
                            placeholder="Example: 80"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Previous Marks
                        </label>

                        <input
                            type="number"
                            name="previous_marks"
                            min="0"
                            max="100"
                            step="0.1"
                            placeholder="Example: 68"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Practical Marks
                        </label>

                        <input
                            type="number"
                            name="practical_marks"
                            min="0"
                            max="100"
                            step="0.1"
                            placeholder="Example: 75"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="submit-btn">
                    🔮 Predict Student Performance
                </button>

            </form>

        </div>


        <div class="footer">

            <p>
                Student Performance Prediction System | Machine Learning Project
            </p>

        </div>

    </div>

</body>

</html>
